<!doctype html><html><head><meta charset="utf-8"><title>Fox Quiz app</title>
<style>
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:#f6f6f7; color:#202223; }
  .app-header { position: sticky; top:0; background:#fff; border-bottom:1px solid #e1e3e5; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
  .page { padding: 20px; display:grid; gap:16px; }
  .Polaris-Card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .Polaris-Button { background:#303030; color:#fff; border:0; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; }
  .quiz-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid #f1f1f1; }
</style></head>
<body>
<header class="app-header"><h1 class="app-header__title" style="margin:0;font-size:20px">Quizzes</h1><button class="Polaris-Button" id="create-quiz">Create quiz</button></header>
<div class="page">
  <section class="Polaris-Card quiz-list" id="quiz-list">
    <h2 style="margin-top:0">Your quizzes</h2>
    <div class="quiz-row"><span class="quiz-row__name">Which yarn are you?</span><button class="Polaris-Button quiz-row__edit">Edit</button></div>
    <div class="quiz-row"><span class="quiz-row__name">Gift finder</span><button class="Polaris-Button quiz-row__edit">Edit</button></div>
  </section>
  <section class="Polaris-Card"><div style="height:900px;background:repeating-linear-gradient(0deg,#fafafa 0 40px,#fff 40px 80px)"></div></section>
  <section class="Polaris-Card settings-card" id="settings"><h2 style="margin:0 0 8px">Settings</h2><button class="Polaris-Button" id="save-settings">Save settings</button></section>
</div>
<script>window.clicks=[];document.addEventListener('click',e=>window.clicks.push(e.target.id||e.target.className));</script>
</body></html>
