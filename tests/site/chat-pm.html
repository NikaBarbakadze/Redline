<!doctype html><html><head><meta charset="utf-8"><title>Chat (pastes images)</title>
<style>body{font-family:-apple-system;background:#262624;color:#eee;padding:40px}#box{max-width:760px;margin:60px auto;background:#30302e;border-radius:16px;padding:16px}#att img{height:120px;border-radius:8px;margin-right:8px}[contenteditable]{min-height:120px;outline:none;white-space:pre-wrap;font-size:14px}</style></head>
<body><div id="box"><div id="att"></div><div data-testid="chat-input" contenteditable="true"></div></div>
<script>
window.received = [];
document.querySelector('[contenteditable]').addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files ?? [])];
  if (!files.length) return;           // text: let the browser insert it
  e.preventDefault();
  for (const f of files) { window.received.push(f.name); const i = new Image(); i.src = URL.createObjectURL(f); document.getElementById('att').append(i); }
});
</script></body></html>
